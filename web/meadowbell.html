<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hollyoak's Plucky Sprout Squad | Meadowbell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --u: calc(100vw / 1440);
      --btn-green: #5b875c;
      --headline-shadow: 0 calc(4 * var(--u)) calc(18 * var(--u)) rgba(28, 70, 120, 0.28);
      --subline-shadow: 0 calc(2 * var(--u)) calc(10 * var(--u)) rgba(28, 70, 120, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #73a9d9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* ================= 1440x1280 FRAME ================= */
    .hero-frame {
      position: relative;
      width: 100vw;
      height: calc(1280 * var(--u));
      overflow: hidden;
      user-select: none;
    }

    /* ================= SCENE PLATE & VIDEO ================= */
    .scene-plate {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      z-index: 1;
    }

    .scene-video {
      position: absolute;
      width: 100%;
      height: 112.5%;
      top: -6.25%;
      left: 0;
      object-fit: cover;
      object-position: center;
      z-index: 2;
      pointer-events: none;
    }

    .scene-ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: auto;
    }

    /* ================= NAVIGATION ================= */
    .nav-logo {
      position: absolute;
      left: calc(31 * var(--u));
      top: calc(23 * var(--u));
      font-family: 'Grandstander', cursive;
      font-weight: 900;
      font-size: calc(29.5 * var(--u));
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: calc(8 * var(--u));
      text-decoration: none;
      text-shadow: var(--headline-shadow);
      cursor: pointer;
    }

    .nav-logo svg {
      width: calc(26 * var(--u));
      height: calc(26 * var(--u));
      fill: #ffffff;
      filter: drop-shadow(0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(28, 70, 120, 0.25));
    }

    .nav-pill {
      position: absolute;
      left: calc(443 * var(--u));
      top: calc(13 * var(--u));
      width: calc(546 * var(--u));
      height: calc(50 * var(--u));
      border-radius: calc(25 * var(--u));
      background: rgba(173, 196, 174, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding-left: calc(49 * var(--u));
      gap: calc(54 * var(--u));
      transition: transform 0.25s ease;
      box-shadow: 0 calc(4 * var(--u)) calc(16 * var(--u)) rgba(28, 70, 120, 0.12);
    }

    .nav-pill:hover {
      transform: translateY(calc(-2 * var(--u)));
    }

    .nav-item {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(19.5 * var(--u));
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .nav-item:hover {
      opacity: 0.85;
    }

    .btn-nav-join {
      position: absolute;
      left: calc(1311 * var(--u));
      top: calc(14 * var(--u));
      width: calc(105 * var(--u));
      height: calc(45 * var(--u));
      border-radius: calc(22.5 * var(--u));
      background: #ffffff;
      color: var(--btn-green);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(18.5 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 calc(4 * var(--u)) calc(14 * var(--u)) rgba(28, 70, 120, 0.15);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-nav-join:hover {
      transform: translateY(calc(-2 * var(--u)));
      box-shadow: 0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(28, 70, 120, 0.22);
    }

    /* ================= COPY (CENTRED) ================= */
    .hero-kicker {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(203 * var(--u));
      text-align: center;
      font-family: 'Grandstander', cursive;
      font-weight: 900;
      font-size: calc(40.5 * var(--u));
      color: #ffffff;
      letter-spacing: calc(1 * var(--u));
      text-shadow: var(--headline-shadow);
    }

    .hero-headline {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(261 * var(--u));
      text-align: center;
      font-family: 'Grandstander', cursive;
      font-weight: 900;
      font-size: calc(143.5 * var(--u));
      line-height: calc(118 * var(--u));
      color: #ffffff;
      text-shadow: var(--headline-shadow);
    }

    .hero-subline {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(518 * var(--u));
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: calc(21.2 * var(--u));
      line-height: calc(27 * var(--u));
      color: #ffffff;
      text-shadow: var(--subline-shadow);
    }

    .btn-copy-join {
      position: absolute;
      left: calc(550 * var(--u));
      top: calc(617 * var(--u));
      width: calc(144 * var(--u));
      height: calc(59 * var(--u));
      border-radius: calc(29.5 * var(--u));
      background: #ffffff;
      color: var(--btn-green);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(22 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(28, 70, 120, 0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-copy-join:hover {
      transform: translateY(calc(-2 * var(--u)));
      box-shadow: 0 calc(8 * var(--u)) calc(24 * var(--u)) rgba(28, 70, 120, 0.26);
    }

    .btn-watch-preview {
      position: absolute;
      left: calc(707 * var(--u));
      top: calc(619 * var(--u));
      width: calc(184 * var(--u));
      height: calc(58 * var(--u));
      border-radius: calc(29 * var(--u));
      background: rgba(204, 218, 173, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(19.5 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(10 * var(--u));
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 calc(4 * var(--u)) calc(16 * var(--u)) rgba(28, 70, 120, 0.15);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .btn-watch-preview:hover {
      transform: translateY(calc(-2 * var(--u)));
      background: rgba(204, 218, 173, 0.75);
    }

    .play-triangle-icon {
      width: calc(16 * var(--u));
      height: calc(16 * var(--u));
      fill: #ffffff;
      display: inline-block;
    }

    /* ================= CHAPTERS ROW ================= */
    .chapters-title {
      position: absolute;
      left: calc(137 * var(--u));
      top: calc(866 * var(--u));
      font-family: 'Grandstander', cursive;
      font-weight: 900;
      font-size: calc(36 * var(--u));
      color: #ffffff;
      text-shadow: var(--headline-shadow);
      letter-spacing: calc(1 * var(--u));
    }

    .chapters-link {
      position: absolute;
      right: calc(132 * var(--u));
      top: calc(876 * var(--u));
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: calc(22 * var(--u));
      color: #ffffff;
      text-decoration: none;
      text-shadow: var(--subline-shadow);
      display: inline-flex;
      align-items: center;
      gap: calc(6 * var(--u));
      transition: transform 0.25s ease;
      cursor: pointer;
    }

    .chapters-link span.chevron {
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .chapters-link:hover span.chevron {
      transform: translateX(calc(4 * var(--u)));
    }

    .chapter-card {
      position: absolute;
      top: calc(913 * var(--u));
      width: calc(378 * var(--u));
      height: calc(273 * var(--u));
      border-radius: calc(15 * var(--u));
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 calc(8 * var(--u)) calc(24 * var(--u)) rgba(28, 70, 120, 0.22);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.35s ease;
    }

    .chapter-card-1 { left: calc(133 * var(--u)); }
    .chapter-card-2 { left: calc(531 * var(--u)); }
    .chapter-card-3 { left: calc(929 * var(--u)); }

    .card-art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .card-play-btn {
      position: absolute;
      left: calc(20 * var(--u));
      bottom: calc(20 * var(--u));
      width: calc(44 * var(--u));
      height: calc(44 * var(--u));
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 calc(4 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, 0.25);
    }

    .card-play-btn svg {
      width: calc(18 * var(--u));
      height: calc(18 * var(--u));
      fill: var(--btn-green);
      margin-left: calc(2 * var(--u));
    }

    .chapter-card:hover {
      transform: translateY(calc(-8 * var(--u)));
      box-shadow: 0 calc(16 * var(--u)) calc(36 * var(--u)) rgba(28, 70, 120, 0.35);
    }

    .chapter-card:hover .card-art-img {
      transform: scale(1.05);
    }

    /* ================= PHONES (<= 820px) ================= */
    @media (max-width: 820px) {
      .hero-frame {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .scene-plate, .scene-video {
        position: fixed;
        width: 100vw;
        height: 100vh;
        left: 18%;
        transform: translateX(-18%);
        object-fit: cover;
      }

      .scene-ui {
        position: relative;
        padding: 24px 20px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .nav-logo {
        position: static;
        font-size: 26px;
        margin-bottom: 24px;
      }

      .nav-logo svg {
        width: 24px;
        height: 24px;
      }

      .nav-pill {
        display: none;
      }

      .btn-nav-join {
        position: absolute;
        top: 24px;
        right: 20px;
        left: auto;
        width: 90px;
        height: 38px;
        font-size: 15px;
        border-radius: 19px;
      }

      .hero-kicker {
        position: static;
        font-size: 26px;
        margin-top: 40px;
        margin-bottom: 8px;
      }

      .hero-headline {
        position: static;
        font-size: 51px;
        line-height: 48px;
        margin-bottom: 16px;
      }

      .hero-subline {
        position: static;
        font-size: 16px;
        line-height: 22px;
        margin-bottom: 28px;
        padding: 0 16px;
      }

      .copy-buttons-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 60px;
      }

      .btn-copy-join {
        position: static;
        width: 130px;
        height: 50px;
        font-size: 18px;
        border-radius: 25px;
      }

      .btn-watch-preview {
        position: static;
        width: 160px;
        height: 50px;
        font-size: 16px;
        border-radius: 25px;
      }

      .play-triangle-icon {
        width: 14px;
        height: 14px;
      }

      .chapters-header-mobile {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .chapters-title {
        position: static;
        font-size: 24px;
      }

      .chapters-link {
        position: static;
        font-size: 16px;
      }

      .chapters-row-mobile {
        width: 100vw;
        overflow-x: auto;
        display: flex;
        gap: 16px;
        padding: 0 20px;
        margin-left: -20px;
        scrollbar-width: none;
      }

      .chapters-row-mobile::-webkit-scrollbar {
        display: none;
      }

      .chapter-card {
        position: relative;
        top: auto;
        left: auto;
        flex: 0 0 280px;
        height: 202px;
        border-radius: 14px;
      }

      .card-play-btn {
        left: 14px;
        bottom: 14px;
        width: 36px;
        height: 36px;
      }

      .card-play-btn svg {
        width: 14px;
        height: 14px;
      }
    }

    /* ================= REDUCED MOTION ================= */
    @media (prefers-reduced-motion: reduce) {
      .scene-video {
        display: none !important;
      }
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- ================= 1440x1280 HERO FRAME ================= -->
  <div class="hero-frame">
    <!-- Plate: Background Still Image -->
    <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3ca5d10d-ea2f-4907-876f-33bde169469e.jpg" alt="Meadowbell Hillside Background" class="scene-plate">

    <!-- Motion: Looping Video aligned at 100% width, 112.5% height, top -6.25% -->
    <video src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d2cb5bef-f92b-4e91-ae93-8dc6555e56ac.mp4" autoplay muted loop playsinline class="scene-video"></video>

    <!-- UI Overlay Layer -->
    <div class="scene-ui">
      
      <!-- Nav: Logo at (31, 23) -->
      <a href="#" class="nav-logo" id="animLogo">
        <svg viewBox="0 0 24 24">
          <path d="M12 22C12 16.5 7.5 12 2 12C2 17.5 6.5 22 12 22ZM12 22C12 16.5 16.5 12 22 12C22 17.5 17.5 22 12 22ZM12 22V7"/>
        </svg>
        <span>Meadowbell</span>
      </a>

      <!-- Nav: Translucent sage pill (546x50 at 443, 13) -->
      <nav class="nav-pill" id="animNavPill">
        <a href="#farm" class="nav-item">Farm</a>
        <a href="#gear" class="nav-item">Gear</a>
        <a href="#chapters" class="nav-item">Chapters</a>
        <a href="#crew" class="nav-item">Our Crew</a>
      </nav>

      <!-- Nav: Join us white pill (105x45 at 1311, 14) -->
      <a href="#join" class="btn-nav-join" id="animNavJoin">Join us</a>

      <!-- Copy: Kicker at y = 203 -->
      <div class="hero-kicker" id="animKicker">HOLLYOAK'S</div>

      <!-- Copy: Headline at y = 261 -->
      <h1 class="hero-headline" id="animHeadline">
        <span class="hl-line-1" style="display:block;">PLUCKY</span>
        <span class="hl-line-2" style="display:block;">SPROUT SQUAD</span>
      </h1>

      <!-- Copy: Subline at y = 518 -->
      <p class="hero-subline" id="animSubline">
        Learn the Ways of the Meadow with<br>
        Hollyoak's Plucky Sprout Squad! Each chapter is<br>
        packed with play, chores, and wonder.
      </p>

      <!-- Copy: Join us button at (550, 617) -->
      <a href="#join" class="btn-copy-join" id="animCopyJoin">Join us</a>

      <!-- Copy: Watch preview button at (707, 619) -->
      <a href="#preview" class="btn-watch-preview" id="animPreview">
        <svg class="play-triangle-icon" viewBox="0 0 24 24">
          <path d="M7 4.5V19.5L19 12L7 4.5Z" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" fill="#ffffff"/>
        </svg>
        <span>Watch preview</span>
      </a>

      <!-- Chapters Row Header -->
      <div class="chapters-title" id="animChapTitle">CHAPTERS</div>
      <a href="#all-chapters" class="chapters-link" id="animChapLink">
        <span>browse all chapters</span>
        <span class="chevron">›</span>
      </a>

      <!-- Cards: Three 378x273 cards at x = 133, 531, 929 (y = 913) -->
      <div class="chapter-card chapter-card-1" id="animCard1">
        <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/cd2d844f-ae3f-4fa9-8067-b077530b6e71.webp" alt="Vegetable garden cottage" class="card-art-img">
        <div class="card-play-btn">
          <svg viewBox="0 0 24 24">
            <path d="M7 5V19L18 12L7 5Z"/>
          </svg>
        </div>
      </div>

      <div class="chapter-card chapter-card-2" id="animCard2">
        <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/48f5b97e-c27c-4afd-9427-eb35aebd1751.webp" alt="Boy and dog among sheep" class="card-art-img">
        <div class="card-play-btn">
          <svg viewBox="0 0 24 24">
            <path d="M7 5V19L18 12L7 5Z"/>
          </svg>
        </div>
      </div>

      <div class="chapter-card chapter-card-3" id="animCard3">
        <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/cde5384e-ce4d-423f-925a-451b779066e0.webp" alt="Girl in straw hat flying kite" class="card-art-img">
        <div class="card-play-btn">
          <svg viewBox="0 0 24 24">
            <path d="M7 5V19L18 12L7 5Z"/>
          </svg>
        </div>
      </div>

    </div>
  </div>

  <!-- Web Animations Entrance Timeline -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check prefers-reduced-motion
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        return;
      }

      const logo = document.getElementById('animLogo');
      const navPill = document.getElementById('animNavPill');
      const navJoin = document.getElementById('animNavJoin');
      const kicker = document.getElementById('animKicker');
      const hlLine1 = document.querySelector('.hl-line-1');
      const hlLine2 = document.querySelector('.hl-line-2');
      const subline = document.getElementById('animSubline');
      const copyJoin = document.getElementById('animCopyJoin');
      const preview = document.getElementById('animPreview');
      const chapTitle = document.getElementById('animChapTitle');
      const chapLink = document.getElementById('animChapLink');
      const card1 = document.getElementById('animCard1');
      const card2 = document.getElementById('animCard2');
      const card3 = document.getElementById('animCard3');

      // Helper for keyframes
      const dropIn = [
        { opacity: 0, transform: 'translateY(-20px)' },
        { opacity: 1, transform: 'translateY(0)' }
      ];

      const unblur = [
        { opacity: 0, filter: 'blur(12px)' },
        { opacity: 1, filter: 'blur(0px)' }
      ];

      const springUp = [
        { opacity: 0, transform: 'translateY(30px) scale(0.96)', filter: 'blur(8px)' },
        { opacity: 1, transform: 'translateY(0) scale(1)', filter: 'blur(0px)' }
      ];

      const riseUp = [
        { opacity: 0, transform: 'translateY(24px)' },
        { opacity: 1, transform: 'translateY(0)' }
      ];

      // Sequential Entrance Timeline
      setTimeout(() => {
        if (logo) logo.animate(dropIn, { duration: 600, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
        if (navPill) navPill.animate(dropIn, { duration: 600, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards', delay: 80 });
        if (navJoin) navJoin.animate(dropIn, { duration: 600, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards', delay: 120 });
      }, 100);

      setTimeout(() => {
        if (kicker) kicker.animate(unblur, { duration: 700, easing: 'ease-out', fill: 'forwards' });
      }, 400);

      setTimeout(() => {
        if (hlLine1) hlLine1.animate(springUp, { duration: 750, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)', fill: 'forwards' });
      }, 650);

      setTimeout(() => {
        if (hlLine2) hlLine2.animate(springUp, { duration: 750, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)', fill: 'forwards' });
      }, 810);

      setTimeout(() => {
        if (subline) subline.animate(riseUp, { duration: 600, easing: 'ease-out', fill: 'forwards' });
      }, 1050);

      setTimeout(() => {
        if (copyJoin) copyJoin.animate(riseUp, { duration: 500, easing: 'ease-out', fill: 'forwards' });
        if (preview) preview.animate(riseUp, { duration: 500, easing: 'ease-out', fill: 'forwards', delay: 80 });
      }, 1250);

      setTimeout(() => {
        if (chapTitle) chapTitle.animate(riseUp, { duration: 500, easing: 'ease-out', fill: 'forwards' });
        if (chapLink) chapLink.animate(riseUp, { duration: 500, easing: 'ease-out', fill: 'forwards', delay: 60 });
        if (card1) card1.animate(riseUp, { duration: 600, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1)', fill: 'forwards', delay: 100 });
        if (card2) card2.animate(riseUp, { duration: 600, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1)', fill: 'forwards', delay: 200 });
        if (card3) card3.animate(riseUp, { duration: 600, easing: 'cubic-bezier(0.2, 0.9, 0.3, 1)', fill: 'forwards', delay: 300 });
      }, 1450);
    });
  </script>
</body>
</html>
